<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/a/AVvXsEjvyHVCZolj28lEOEFo6M63izh7RcOq9tc7jph7e_Or-jSWVQ5TjRb0hcc-168k9rTwL9XnC9FdUti7imfIyv6QTbWgHDZB7zroM2I3nvUK58Zf6_sARve9qfBkasedBGsBkLahFohBhq2fbLB-hPSlFVrk5haPLt0Uy2jDnTszkHq0Qn3NfzkmK8vhNLI=w104-h117">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="auth-guard.js"></script>
    <meta charset="UTF-8">
    <title>Controlador MT-512 | Refrigeração Eliezer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body { -webkit-user-select: none; user-select: none; }
        input, select, textarea { -webkit-user-select: text !important; user-select: text !important; }
        img { pointer-events: none !important; -webkit-user-drag: none !important; }

        :root {
            --bg: #0d1117;
            --text: #ffffff;
            --sub: rgba(255,255,255,0.38);
            --glass: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.08);
            --input-bg: rgba(255,255,255,0.05);
        }
        body.light-mode {
            --bg: #f0f2f5;
            --text: #1a1f26;
            --sub: rgba(0,0,0,0.45);
            --glass: rgba(255,255,255,0.82);
            --border: rgba(0,0,0,0.09);
            --input-bg: rgba(0,0,0,0.04);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
            position: relative;
            transition: background 0.3s, color 0.3s;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient glow (mesma identidade do painel de sistemas) */
        .glow { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(90px); z-index: 0; }
        .glow-a { width: 500px; height: 500px; top: -180px; right: -140px; background: rgba(30,64,175,0.08); }
        .glow-b { width: 380px; height: 380px; bottom: -120px; left: -120px; background: rgba(16,185,129,0.05); }

        .page {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.5s ease-out both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 16px;
        }
        .brand-title { font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.5px; line-height: 1; }
        .brand-title span { color: #1e40af; }
        .brand-sub { font-size: 9px; font-weight: 800; color: #1e40af; text-transform: uppercase; letter-spacing: 0.14em; margin-top: 4px; }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            width: 38px; height: 38px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14px;
            transition: background 0.2s;
            text-decoration: none;
        }
        .icon-btn:hover { background: rgba(30,64,175,0.12); }

        /* ── Filtros por categoria (carrossel arrastável) ── */
        .filtros-wrap {
            position: relative;
            margin-bottom: 18px;
        }
        .filtros {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
            touch-action: pan-y;
            padding-bottom: 4px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }
        .filtros.arrastando { cursor: grabbing; scroll-behavior: auto; }
        .filtros::-webkit-scrollbar { display: none; }
        .filtros { -ms-overflow-style: none; scrollbar-width: none; }

        /* Sombra nas bordas indicando que há mais botões fora da tela */
        .filtros-wrap::before,
        .filtros-wrap::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 4px;
            width: 24px;
            pointer-events: none;
            z-index: 2;
            transition: opacity 0.2s;
            opacity: 0;
        }
        .filtros-wrap::before {
            left: 0;
            background: linear-gradient(90deg, var(--bg), transparent);
        }
        .filtros-wrap::after {
            right: 0;
            background: linear-gradient(270deg, var(--bg), transparent);
        }
        .filtros-wrap.tem-overflow-esq::before { opacity: 1; }
        .filtros-wrap.tem-overflow-dir::after { opacity: 1; }

        .filtro-btn {
            flex-shrink: 0;
            scroll-snap-align: start;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--sub);
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .filtro-btn:hover { border-color: rgba(59,130,246,0.4); }
        .filtro-btn.active {
            background: linear-gradient(135deg,#1e40af,#3b82f6);
            color: white;
            border-color: transparent;
        }

        /* ── Busca ── */
        .search-wrap { position: relative; margin-bottom: 18px; }
        .search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--sub); font-size: 13px; }
        #buscaInput {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 13px 40px 13px 38px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        #buscaInput:focus { border-color: #3b82f6; }
        #buscaInput::placeholder { color: var(--sub); }
        #limparBusca {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--border);
            color: var(--text);
            width: 20px; height: 20px;
            border-radius: 50%;
            border: none;
            font-size: 11px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #limparBusca.show { display: flex; }

        /* ── Section label ── */
        .section-label {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--sub);
            margin-bottom: 10px;
            margin-left: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        /* ── Lista de tópicos (cartões-resumo, clicáveis) ── */
        .lista-topicos { display: flex; flex-direction: column; gap: 8px; }

        .topico-card {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 13px 14px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 18px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            text-align: left;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
        }
        .topico-card:hover { transform: translateY(-2px); border-color: rgba(59,130,246,0.35); background: rgba(59,130,246,0.06); }
        .topico-card:active { transform: scale(0.98); }

        .topico-card-icon {
            width: 40px; height: 40px;
            border-radius: 11px;
            flex-shrink: 0;
            background: linear-gradient(135deg,#1e40af,#3b82f6);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
        }
        /* Ícones coloridos por grupo: funções que trabalham juntas usam a mesma cor,
           pra reconhecer visualmente o "parceiro" de cada parâmetro sem precisar ler. */
        .topico-card-icon.grupo-setpoint { background: linear-gradient(135deg,#0e7490,#22d3ee); } /* F02 · F06 · F07 */
        .topico-card-icon.grupo-faixa    { background: linear-gradient(135deg,#6d28d9,#c084fc); } /* F04 · F05 */
        .topico-card-icon.grupo-tempos   { background: linear-gradient(135deg,#9d174d,#f472b6); } /* F08 · F09 */
        .topico-card-icon.grupo-degelo   { background: linear-gradient(135deg,#c2410c,#fb923c); } /* F10 · F11 · F12 · F13 */
        .topico-card-icon.grupo-erro     { background: linear-gradient(135deg,#991b1b,#f87171); } /* F16 · F17 · F18 */
        .topico-card-text { min-width: 0; flex: 1; }
        .topico-card-text strong {
            display: block;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.25;
        }
        .topico-card-text span {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 13px;
            color: var(--sub);
            font-weight: 500;
            margin-top: 3px;
            line-height: 1.45;
        }
        .topico-card-cat {
            display: inline-block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #3b82f6;
            margin-top: 5px;
        }
        .topico-card-senha {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #f59e0b;
            margin-top: 4px;
            margin-left: 8px;
        }
        .aviso-senha {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(245,158,11,0.08);
            border: 1px solid rgba(245,158,11,0.3);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 16px;
        }
        .aviso-senha .aviso-icone {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg,#92400e,#f59e0b);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .aviso-senha .aviso-texto { font-size: 13.5px; line-height: 1.5; }
        .aviso-senha .aviso-texto strong { color: #f59e0b; }
        .topico-card-arrow { color: var(--sub); font-size: 11px; flex-shrink: 0; }
        .topico-card:hover .topico-card-arrow { color: var(--text); }

        /* ── Botão voltar (dentro do detalhe do tópico) ── */
        .btn-voltar-topico {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            cursor: pointer;
            margin-bottom: 18px;
            transition: background 0.2s;
        }
        .btn-voltar-topico:hover { background: rgba(59,130,246,0.1); }

        /* ── Grupo / Tópico (visão detalhada) ── */
        .topico { margin-bottom: 26px; }
        .topico-header { text-align: center; margin-bottom: 16px; }
        .topico-titulo {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.25;
        }
        .topico-titulo .marca { color: #3b82f6; }
        .topico-modelo {
            font-size: 11px;
            font-weight: 700;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 2px;
        }

        /* ── Linha de ações (voltar + exportar) ── */
        .topico-acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
        .topico-acoes .btn-voltar-topico { margin-bottom: 0; flex-shrink: 0; }
        .btn-exportar-topico {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 12px;
            padding: 10px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1 1 130px;
            background: rgba(59,130,246,0.1);
            border: 1px solid rgba(59,130,246,0.3);
            color: #3b82f6;
        }
        .btn-exportar-topico:hover { background: rgba(59,130,246,0.18); }

        /* ── Toast de feedback (ex: "copiado!") ── */
        .toast-feedback {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%) translateY(20px);
            background: #111827;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 999;
        }
        .toast-feedback.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-feedback i { color: #22c55e; }

        /* ── Tópicos relacionados (rodapé do tópico) ── */
        .relacionados { margin-top: 22px; }
        .relacionados-titulo {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--sub);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .relacionados-lista { display: flex; flex-direction: column; gap: 8px; }
        .relacionado-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 12px;
            cursor: pointer;
            text-align: left;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            transition: background 0.2s, border-color 0.2s;
        }
        .relacionado-item:hover { background: rgba(59,130,246,0.06); border-color: rgba(59,130,246,0.3); }
        .relacionado-item .topico-card-icon { width: 32px; height: 32px; font-size: 13px; border-radius: 9px; }
        .relacionado-item span { font-size: 13px; font-weight: 700; line-height: 1.25; }
        .relacionado-item i.chevron { margin-left: auto; color: var(--sub); font-size: 11px; }

        /* ── Passos (cards) ── */
        .passos { display: flex; flex-direction: column; gap: 14px; }

        .passo-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .passo-card:hover { transform: translateY(-2px); border-color: rgba(59,130,246,0.35); }

        .passo-numero {
            display: flex;
            align-items: center;
            gap: 8px;
            align-self: flex-start;
        }
        .passo-numero .badge {
            width: 22px; height: 22px;
            border-radius: 7px;
            background: linear-gradient(135deg,#1e40af,#3b82f6);
            color: white;
            font-size: 11px;
            font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .passo-label {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #3b82f6;
        }

        .passo-desc {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text);
            text-align: center;
            padding: 0 4px;
        }

        .passo-imagem {
            width: 100%;
            max-width: 260px;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            border: 2px dashed var(--border);
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .passo-imagem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .passo-imagem.vazio {
            flex-direction: column;
            gap: 6px;
            color: var(--sub);
        }
        .passo-imagem.vazio i { font-size: 20px; }
        .passo-imagem.vazio span { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }

        /* ── Estado vazio (nenhum resultado na busca) ── */
        .sem-resultado {
            text-align: center;
            color: var(--sub);
            font-size: 13px;
            padding: 40px 20px;
        }
        .sem-resultado i { font-size: 26px; display: block; margin-bottom: 10px; opacity: 0.5; }
    </style>
    <script src="config.js"></script>
</head>
<body>

<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<div class="page">

    <header class="header">
        <div>
            <div class="brand-title">Controlador <span>MT-512</span></div>
            <div class="brand-sub">Guias e Procedimentos</div>
        </div>
        <div class="header-actions">
            <a href="sistemas.html" class="icon-btn" title="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <button onclick="toggleTheme()" class="icon-btn" title="Tema">
                <i id="theme-icon" class="fa-solid fa-sun"></i>
            </button>
        </div>
    </header>

    <div class="filtros-wrap" id="filtrosWrap">
        <div class="filtros" id="filtrosCategoria"></div>
    </div>

    <div class="search-wrap" id="searchWrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="buscaInput" placeholder="Buscar por função, código de erro (Er1, F06)...">
        <button id="limparBusca" title="Limpar busca">&times;</button>
    </div>

    <div id="listaTopicos"></div>

</div>

<script>
    // =====================================================================
    // 🏢 IDENTIDADE DA EMPRESA — usada no cabeçalho dos arquivos exportados
    // e no texto que vai pro WhatsApp/compartilhamento. Pra trocar nome ou
    // logo, edite só aqui — não precisa mexer no resto do código.
    // =====================================================================
    const NOME_EMPRESA = "Refrigeração Eliezer";
    let LOGO_EMPRESA = "https://blogger.googleusercontent.com/img/a/AVvXsEjvyHVCZolj28lEOEFo6M63izh7RcOq9tc7jph7e_Or-jSWVQ5TjRb0hcc-168k9rTwL9XnC9FdUti7imfIyv6QTbWgHDZB7zroM2I3nvUK58Zf6_sARve9qfBkasedBGsBkLahFohBhq2fbLB-hPSlFVrk5haPLt0Uy2jDnTszkHq0Qn3NfzkmK8vhNLI=w104-h117";
    // A logo acima é o padrão de fallback. Se a planilha tiver uma logo salva
    // (aba "empresa", campo emp_logo), ela é usada no lugar automaticamente.
    buscarConfigEmpresa().then(cfg => {
        const item = Array.isArray(cfg) ? cfg.find(d => d.emp_nome) : null;
        const url = item && item.emp_logo;
        if (url) LOGO_EMPRESA = url;
    });

    // =====================================================================
    // 📋 CONTEÚDO DO MANUAL — edite/adicione aqui
    // =====================================================================
    // Cada item de TOPICOS é um assunto (ex: uma função específica de um
    // aparelho). Cada tópico tem uma lista de "passos", exibidos em ordem
    // como cards.
    //
    // Campos de cada tópico:
    //   titulo    -> nome da função/assunto (ex: "Como alterar a temperatura")
    //   modelo    -> aparelho/marca a que se refere
    //   resumo    -> UMA frase curta explicando do que se trata (aparece no
    //                botão/cartão da lista, antes de abrir o tópico).
    //   categoria -> usada para gerar os botões de filtro no topo da página.
    //                Tópicos com a MESMA categoria caem debaixo do MESMO botão.
    //                Ex: "Temperatura", "Alarmes", "Configuração Inicial".
    //                O botão "Todos" aparece sempre e mostra tudo.
    //   senha     -> OPCIONAL. Preencha só se essa função exigir digitar um
    //                código de acesso no aparelho para chegar até ela
    //                (ex: senha: "123"). Isso mostra um aviso destacado com
    //                cadeado no cartão da lista e no topo do tópico aberto.
    //                Deixe sem esse campo se a função não pedir senha.
    //   grupoCor  -> OPCIONAL. Usado só nos parâmetros F01-F21 que trabalham
    //                em conjunto com outro(s). Funções do mesmo grupo ganham
    //                o mesmo ícone colorido, pra reconhecer visualmente quem
    //                é "parceiro" de quem sem precisar ler o texto todo.
    //                Valores disponíveis: "setpoint" (F02·F06·F07),
    //                "faixa" (F04·F05), "tempos" (F08·F09),
    //                "degelo" (F10·F11·F12·F13), "erro" (F16·F17·F18).
    //                Deixe sem esse campo pra manter o ícone azul padrão
    //                (funções que não têm um par direto, como F01, F03,
    //                F14, F15, F19, F20, F21).

                {
                    label: "Resolução: 0,1°C (entre -10 e 100°C) / 1°C fora dessa faixa",
                    descricao: "É a precisão da leitura no display. Dentro da faixa mais comum (-10 a 100°C) mostra casa decimal (ex: 4,3°C); fora dela, só número inteiro.",
                    imagem: ""
                },
                {
                    label: "Alimentação: 115 ou 230 Vac ±10%",
                    descricao: "É a tensão da rede elétrica que alimenta o próprio aparelho — não confundir com a tensão da carga que ele controla. O ±10% é a tolerância de variação que ele aguenta sem problema.",
                    imagem: ""
                },
                {
                    label: "Corrente máxima da carga: 16A (resistiva) / 12A (indutiva)",
                    descricao: "O que o relé interno aguenta acionar diretamente. Resistiva = aquecedores/resistências. Indutiva = motores/compressores, que puxam mais corrente na partida (por isso o limite é menor). Se a carga passar disso, use uma contatora: o MT512E aciona a contatora, e ela aciona a carga pesada.",
                    imagem: ""
                },
                {
                    label: "Potência máxima: 2HP",
                    descricao: "É o resumo prático do limite de corrente acima — a maior potência de compressor/motor que ele aguenta ligar sem precisar de contatora.",
                    imagem: ""
                },
                {
                    label: "Temperatura de operação: 0 a 50°C",
                    descricao: "Não é a temperatura que ele controla — é a temperatura do ambiente onde o próprio controlador fica instalado (o painel, a parede). Se o local de instalação passar disso, pode dar problema no aparelho.",
                    imagem: ""
                },
                {
                    label: "Umidade de operação: 10 a 90% UR, sem condensação",
                    descricao: "Mesma lógica da temperatura de operação — é a umidade do ambiente onde o aparelho está instalado, não do que ele está controlando. \"Sem condensação\" significa que não pode formar gotas de água em cima do circuito.",
                    imagem: ""
                },
                {
                    label: "Grau de proteção: IP65 (frontal)",
                    descricao: "Código de resistência a poeira/água. O 65 indica totalmente protegido contra poeira e resistente a jatos de água — mas só na parte frontal (por isso ele vem com um vinil protetor pra colar por cima em locais com respingo, como balcão frigorífico).",
                    imagem: ""
                },
                {
                    label: "Dimensões: 76 x 34 x 77mm / recorte no painel: 71 x 29mm",
                    descricao: "O tamanho físico do aparelho e o tamanho exato que precisa ser cortado no painel/gabinete para ele encaixar.",
                    imagem: ""
                }
            ]
        }
        // ,{ titulo: "Novo assunto aqui", modelo: "MT512E 2HP", resumo: "Uma frase curta explicando do que se trata", categoria: "Alarmes", passos: [ ... ] }
    ];

    // =====================================================================
    // Renderização (não precisa mexer daqui pra baixo)
    // =====================================================================
    const listaEl     = document.getElementById('listaTopicos');
    const filtrosEl   = document.getElementById('filtrosCategoria');
    const filtrosWrap = document.getElementById('filtrosWrap');
    const searchWrap  = document.getElementById('searchWrap');
    const buscaInput  = document.getElementById('buscaInput');
    const limparBusca = document.getElementById('limparBusca');
    let categoriaAtual = 'todos';
    let termoBusca = '';

    function normalizar(txt) {
        return (txt || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function topicoBateComBusca(t) {
        if (!termoBusca) return true;
        const alvo = normalizar(
            t.titulo + ' ' + (t.resumo || '') + ' ' + (t.categoria || '') + ' ' + t.modelo + ' ' +
            t.passos.map(p => p.label + ' ' + p.descricao).join(' ')
        );
        return alvo.includes(termoBusca);
    }

    function atualizarSombras() {
        const max = filtrosEl.scrollWidth - filtrosEl.clientWidth;
        filtrosWrap.classList.toggle('tem-overflow-esq', filtrosEl.scrollLeft > 4);
        filtrosWrap.classList.toggle('tem-overflow-dir', filtrosEl.scrollLeft < max - 4);
    }

    let topicoAberto = null; // índice do tópico aberto em TOPICOS, ou null = mostrando a lista

    // =====================================================================
    // NAVEGAÇÃO POR HISTÓRICO (pra gesto de "voltar" do celular funcionar)
    // Cada vez que abrimos um tópico, empurramos um estado no histórico do
    // navegador. Assim, arrastar o dedo pra voltar (ou o botão físico/gesto
    // de voltar do Android) dispara "popstate", e a gente só fecha o tópico
    // em vez de sair da página inteira.
    // =====================================================================
    function abrirTopico(idx) {
        topicoAberto = idx;
        history.pushState({ topico: idx }, '');
        renderTopicos();
        window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function fecharTopico() {
        // Se o estado atual do histórico corresponde a um tópico aberto,
        // usamos history.back() pra manter a pilha de navegação consistente
        // (senão o próximo gesto de "voltar" ainda tentaria fechar de novo).
        if (history.state && history.state.topico != null) {
            history.back();
        } else {
            topicoAberto = null;
            renderTopicos();
            window.scrollTo({ top: 0, behavior: 'instant' });
        }
    }

    window.addEventListener('popstate', (e) => {
        topicoAberto = (e.state && e.state.topico != null) ? e.state.topico : null;
        renderTopicos();
        window.scrollTo({ top: 0, behavior: 'instant' });
    });

    function renderFiltros() {
        const categorias = ['todos', ...new Set(TOPICOS.map(t => t.categoria || 'Geral'))];

        filtrosEl.innerHTML = categorias.map(cat => `
            <button class="filtro-btn ${cat === categoriaAtual ? 'active' : ''}" data-cat="${cat}">
                ${cat === 'todos' ? 'Todos' : cat}
            </button>
        `).join('');

        filtrosEl.querySelectorAll('.filtro-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                categoriaAtual = btn.dataset.cat;
                topicoAberto = null; // volta pra lista ao trocar de categoria
                renderFiltros();
                renderTopicos();
            });
        });

        // Recalcula as sombras de "tem mais conteúdo" após recriar os botões
        requestAnimationFrame(atualizarSombras);
    }

    // =====================================================================
    // ÍCONES POR TEMA
    // Escolhe um ícone (Font Awesome) que combina com o assunto do tópico,
    // olhando palavras-chave no título e na categoria. A primeira regra que
    // bater na lista abaixo é usada — a ordem importa. Se nenhuma bater,
    // cai no ícone padrão (fa-file-lines).
    // Pra ajustar/adicionar um ícone novo, é só acrescentar uma linha no
    // array ICONES_POR_TEMA: { teste: /palavra-chave/i, icone: "fa-nome-do-icone" }
    // =====================================================================
    // A ordem importa: regras mais específicas primeiro, regras genéricas
    // (que pegariam vários tópicos parecidos, tipo "degelo") por último.
    const ICONES_POR_TEMA = [
        { teste: /travar indicação/i,                              icone: "fa-lock" },              // F13
        { teste: /setpoint (mínimo|máximo) permitido/i,            icone: "fa-ruler-combined" },     // F04 · F05
        { teste: /setpoint|temperatura desejada/i,                 icone: "fa-temperature-half" },   // ajuste geral · F02
        { teste: /bloquear\/desbloquear|bloqueio das funções/i,    icone: "fa-lock" },                // bloqueio · F20
        { teste: /desligar\/religar|desligamento das funções/i,    icone: "fa-power-off" },           // liga/desliga · F21
        { teste: /processo atual/i,                                icone: "fa-gears" },
        { teste: /mín\/máx|registradas/i,                          icone: "fa-clock-rotate-left" },
        { teste: /unidade de medida|°c ou °f/i,                    icone: "fa-arrows-rotate" },
        { teste: /menu de parâmetros avançados/i,                  icone: "fa-sliders" },
        { teste: /mensagem no display/i,                           icone: "fa-display" },
        { teste: /código de acesso/i,                              icone: "fa-key" },
        { teste: /deslocamento de indicação|offset/i,              icone: "fa-ruler" },
        { teste: /diferencial de controle|histerese/i,             icone: "fa-arrows-up-down" },
        { teste: /modo de operação/i,                              icone: "fa-toggle-on" },
        { teste: /tempo mínimo de saída/i,                         icone: "fa-stopwatch" },           // F08 · F09
        { teste: /energizar o instrumento/i,                       icone: "fa-plug" },                // F12
        { teste: /retardo na energização|delay inicial/i,          icone: "fa-hourglass-half" },      // F14
        { teste: /tempo adicional no primeiro ciclo/i,             icone: "fa-hourglass-half" },      // F15
        { teste: /sensor com defeito|compressor (ligado|desligado) com erro/i, icone: "fa-triangle-exclamation" }, // F16-F18
        { teste: /filtro digital/i,                                icone: "fa-filter" },
        { teste: /especificaç(ões|ão) técnicas/i,                  icone: "fa-clipboard-list" },
        { teste: /degelo/i,                                        icone: "fa-snowflake" },           // pega o resto dos temas de degelo
        { teste: /alarme/i,                                        icone: "fa-bell" },
    ];

    function iconeDoTopico(t) {
        const alvo = (t.titulo || '') + ' ' + (t.categoria || '');
        const regra = ICONES_POR_TEMA.find(r => r.teste.test(alvo));
        return regra ? regra.icone : "fa-file-lines";
    }

    function renderTopicos() {
        // Enquanto um tópico está aberto, escondemos os filtros/busca
        // (não fazem sentido na tela de detalhe) e mostramos só o botão voltar.
        const mostrarControles = topicoAberto === null;
        filtrosWrap.style.display = mostrarControles ? '' : 'none';
        searchWrap.style.display  = mostrarControles ? '' : 'none';

        if (topicoAberto !== null) {
            renderDetalheTopico(topicoAberto);
            return;
        }

        const filtrados = TOPICOS
            .map((t, i) => ({ ...t, _idx: i }))
            .filter(t => (categoriaAtual === 'todos' || (t.categoria || 'Geral') === categoriaAtual) && topicoBateComBusca(t));

        if (filtrados.length === 0) {
            listaEl.innerHTML = `
                <div class="sem-resultado">
                    <i class="fa-solid fa-folder-open"></i>
                    ${termoBusca ? 'Nada encontrado para essa busca.' : 'Nenhum guia nesta categoria ainda.'}
                </div>`;
            return;
        }

        listaEl.innerHTML = `
            <div class="lista-topicos">
                ${filtrados.map(t => `
                    <button class="topico-card" data-idx="${t._idx}">
                        <div class="topico-card-icon ${t.grupoCor ? 'grupo-' + t.grupoCor : ''}"><i class="fa-solid ${iconeDoTopico(t)}"></i></div>
                        <div class="topico-card-text">
                            <strong>${t.titulo}</strong>
                            <span>${t.resumo || (t.passos[0] ? t.passos[0].descricao : '')}</span>
                            ${t.categoria ? `<div class="topico-card-cat">${t.categoria}</div>` : ''}
                            ${t.senha ? `<span class="topico-card-senha"><i class="fa-solid fa-lock"></i> Senha: ${t.senha}</span>` : ''}
                        </div>
                        <i class="fa-solid fa-chevron-right topico-card-arrow"></i>
                    </button>
                `).join('')}
            </div>`;

        listaEl.querySelectorAll('.topico-card').forEach(btn => {
            btn.addEventListener('click', () => {
                abrirTopico(parseInt(btn.dataset.idx, 10));
            });
        });
    }

    buscaInput.addEventListener('input', () => {
        termoBusca = normalizar(buscaInput.value.trim());
        limparBusca.classList.toggle('show', buscaInput.value.length > 0);
        renderTopicos();
    });

    limparBusca.addEventListener('click', () => {
        buscaInput.value = '';
        termoBusca = '';
        limparBusca.classList.remove('show');
        renderTopicos();
        buscaInput.focus();
    });

    let toastTimeout = null;
    function mostrarToast(mensagem, icone = 'fa-check') {
        let toast = document.querySelector('.toast-feedback');
        if (!toast) {
            toast = document.createElement('div');
            toast.className = 'toast-feedback';
            document.body.appendChild(toast);
        }
        toast.innerHTML = `<i class="fa-solid ${icone}"></i> ${mensagem}`;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Tópicos "parceiros": mesmo grupoCor, exceto o próprio tópico aberto.
    function topicosRelacionados(t, idxAtual) {
        if (!t.grupoCor) return [];
        return TOPICOS
            .map((outro, i) => ({ ...outro, _idx: i }))
            .filter(outro => outro.grupoCor === t.grupoCor && outro._idx !== idxAtual);
    }

    // =====================================================================
    // EXPORTAR TÓPICO COMO HTML AVULSO
    // Gera um arquivo .html independente do site — sem login, sem os
    // outros tópicos — só aquele passo a passo, com os GIFs funcionando
    // (referenciam o link público do Blogger, então precisa de internet
    // pra carregar as imagens, mas anima normal).
    // =====================================================================
    function slugify(str) {
        return (str || 'topico')
            .toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/(^-|-$)/g, '')
            .slice(0, 60) || 'topico';
    }

    function gerarHtmlAvulso(t) {
        const passosHtml = t.passos.map((p, i) => `
            <div class="passo-card">
                <div class="passo-numero">
                    <div class="badge">${i + 1}</div>
                    <div class="passo-label">${p.label}</div>
                </div>
                <div class="passo-desc">${p.descricao}</div>
                ${p.imagem ? `<div class="passo-imagem"><img src="${p.imagem}" alt="${p.label}" loading="lazy"></div>` : ''}
            </div>
        `).join('');

        return `<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${t.titulo} | ${NOME_EMPRESA}</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { --bg:#0d1117; --text:#ffffff; --sub:rgba(255,255,255,0.38); --glass:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.08); --input-bg:rgba(255,255,255,0.05); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:24px 16px 48px; -webkit-font-smoothing:antialiased; }
    .page { max-width:460px; margin:0 auto; }
    .cabecalho { display:flex; align-items:center; gap:12px; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--border); }
    .cabecalho img { width:42px; height:42px; border-radius:12px; object-fit:cover; flex-shrink:0; }
    .cabecalho .nome-empresa { font-size:16px; font-weight:800; line-height:1.2; }
    .cabecalho .selo-sub { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--sub); margin-top:2px; }
    .topico-titulo { font-size:19px; font-weight:800; line-height:1.3; margin-bottom:4px; }
    .topico-modelo { font-size:11px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:18px; }
    .aviso-senha { display:flex; align-items:center; gap:12px; background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.3); border-radius:14px; padding:12px 14px; margin-bottom:18px; }
    .aviso-icone { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#92400e,#f59e0b); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
    .aviso-texto { font-size:13.5px; line-height:1.5; }
    .aviso-texto strong { color:#f59e0b; }
    .passos { display:flex; flex-direction:column; gap:14px; }
    .passo-card { background:var(--glass); border:1px solid var(--border); border-radius:20px; padding:16px; display:flex; flex-direction:column; align-items:center; gap:12px; }
    .passo-numero { display:flex; align-items:center; gap:8px; align-self:flex-start; }
    .badge { width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg,#1e40af,#3b82f6); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .passo-label { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; color:#3b82f6; }
    .passo-desc { font-size:15px; line-height:1.6; text-align:center; padding:0 4px; }
    .passo-imagem { width:100%; max-width:260px; border-radius:16px; overflow:hidden; background:var(--input-bg); }
    .passo-imagem img { width:100%; display:block; }
    .rodape { margin-top:26px; text-align:center; font-size:11px; color:var(--sub); }
    .rodape strong { color:var(--text); }
</style>
</head>
<body>
<div class="page">
    <div class="cabecalho">
        <img src="${LOGO_EMPRESA}" alt="${NOME_EMPRESA}">
        <div>
            <div class="nome-empresa">${NOME_EMPRESA}</div>
            <div class="selo-sub">Guia técnico exportado</div>
        </div>
    </div>
    <div class="topico-titulo">${t.titulo}</div>
    <div class="topico-modelo">${t.modelo}</div>
    ${t.senha ? `
    <div class="aviso-senha">
        <div class="aviso-icone"><i class="fa-solid fa-lock"></i></div>
        <div class="aviso-texto">Para acessar essa função no aparelho, primeiro entre no menu de parâmetros (setas esquerda + direita ao mesmo tempo) até aparecer <strong>F01</strong> na tela — é ali, no F01, que você digita o código de acesso <strong>${t.senha}</strong> e confirma com SET. Só depois disso o aparelho libera a navegação até essa função.</div>
    </div>` : ''}
    <div class="passos">${passosHtml}</div>
    <div class="rodape">Exportado do <strong>${NOME_EMPRESA}</strong><br>As imagens precisam de internet pra carregar.</div>
</div>
</body>
</html>`;
    }

    async function exportarTopico(t) {
        const html = gerarHtmlAvulso(t);
        const nomeArquivo = slugify(t.titulo) + '.html';
        const blob = new Blob([html], { type: 'text/html' });

        // No celular (Android/iOS com suporte), tenta abrir direto o menu
        // de enviar (WhatsApp, e-mail, etc.) já com o arquivo anexado.
        try {
            const arquivo = new File([blob], nomeArquivo, { type: 'text/html' });
            if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
                await navigator.share({
                    files: [arquivo],
                    title: t.titulo,
                    text: `${NOME_EMPRESA} — ${t.titulo}`
                });
                return;
            }
        } catch (e) {
            // usuário cancelou o menu de enviar — não faz nada
            if (e && e.name === 'AbortError') return;
        }

        // Fallback (computador ou navegador sem suporte a compartilhar
        // arquivo): baixa o arquivo normalmente pro dispositivo.
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = nomeArquivo;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        mostrarToast('Arquivo exportado! Agora é só anexar no WhatsApp.', 'fa-check');
    }

    function renderDetalheTopico(idx) {
        const topico = TOPICOS[idx];
        const relacionados = topicosRelacionados(topico, idx);

        listaEl.innerHTML = `
            <div class="topico-acoes">
                <button class="btn-voltar-topico" id="btnVoltarTopico">
                    <i class="fa-solid fa-arrow-left"></i> Voltar
                </button>
                <button class="btn-exportar-topico" id="btnExportarTopico">
                    <i class="fa-solid fa-file-export"></i> Exportar
                </button>
            </div>
            <section class="topico">
                <div class="topico-header">
                    <div class="topico-titulo">${topico.titulo}</div>
                    <div class="topico-modelo">${topico.modelo}</div>
                </div>
                ${topico.senha ? `
                <div class="aviso-senha">
                    <div class="aviso-icone"><i class="fa-solid fa-lock"></i></div>
                    <div class="aviso-texto">Para acessar essa função no aparelho, primeiro entre no menu de parâmetros (setas esquerda + direita ao mesmo tempo) até aparecer <strong>F01</strong> na tela — é ali, no F01, que você digita o código de acesso <strong>${topico.senha}</strong> e confirma com SET. Só depois disso o aparelho libera a navegação até essa função.</div>
                </div>` : ''}
                <div class="passos">
                    ${topico.passos.map((p, i) => `
                        <div class="passo-card">
                            <div class="passo-numero">
                                <div class="badge">${i + 1}</div>
                                <div class="passo-label">${p.label}</div>
                            </div>
                            <div class="passo-desc">${p.descricao}</div>
                            ${p.imagem
                                ? `<div class="passo-imagem"><img src="${p.imagem}" alt="${p.label}"></div>`
                                : `<div class="passo-imagem vazio"><i class="fa-solid fa-image"></i><span>Sem foto ainda</span></div>`
                            }
                        </div>
                    `).join('')}
                </div>
                ${relacionados.length > 0 ? `
                <div class="relacionados">
                    <div class="relacionados-titulo"><i class="fa-solid fa-link"></i> Tópicos relacionados</div>
                    <div class="relacionados-lista">
                        ${relacionados.map(r => `
                            <button class="relacionado-item" data-idx="${r._idx}">
                                <div class="topico-card-icon grupo-${r.grupoCor}"><i class="fa-solid ${iconeDoTopico(r)}"></i></div>
                                <span>${r.titulo}</span>
                                <i class="fa-solid fa-chevron-right chevron"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>` : ''}
            </section>
        `;

        document.getElementById('btnVoltarTopico').addEventListener('click', () => {
            fecharTopico();
        });

        document.getElementById('btnExportarTopico').addEventListener('click', () => {
            exportarTopico(topico);
        });

        listaEl.querySelectorAll('.relacionado-item').forEach(btn => {
            btn.addEventListener('click', () => {
                abrirTopico(parseInt(btn.dataset.idx, 10));
            });
        });
    }

    renderFiltros();
    renderTopicos();
    habilitarArrastoFiltros();

    // ── Carrossel arrastável (mouse, touch e caneta via Pointer Events) ──
    function habilitarArrastoFiltros() {
        let isDown = false;
        let arrastou = false;
        let startX = 0;
        let scrollStart = 0;

        filtrosEl.addEventListener('pointerdown', e => {
            isDown = true;
            arrastou = false;
            startX = e.clientX;
            scrollStart = filtrosEl.scrollLeft;
            // Sem setPointerCapture: capturar o ponteiro no contêiner faz o
            // navegador "roubar" o clique do botão (o clique passa a contar
            // como se tivesse acontecido no contêiner, não no botão), e o
            // filtro nunca troca no mouse — por isso ouvimos o resto do
            // arrasto direto na window em vez de capturar o ponteiro aqui.
        });

        window.addEventListener('pointermove', e => {
            if (!isDown) return;
            const delta = e.clientX - startX;
            if (Math.abs(delta) > 5) {
                arrastou = true;
                filtrosEl.classList.add('arrastando');
                filtrosEl.scrollLeft = scrollStart - delta;
            }
        });

        function soltar() {
            isDown = false;
            filtrosEl.classList.remove('arrastando');
        }
        window.addEventListener('pointerup', soltar);
        window.addEventListener('pointercancel', soltar);

        // Se o usuário estava arrastando, cancela o clique no botão
        // (evita trocar de filtro sem querer ao soltar o arrasto)
        filtrosEl.addEventListener('click', e => {
            if (arrastou) { e.stopPropagation(); e.preventDefault(); }
        }, true);

        filtrosEl.addEventListener('scroll', atualizarSombras);
        window.addEventListener('resize', atualizarSombras);
    }

    // ── Registro do Service Worker (mesmo padrão do restante do app) ──
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (
            (e.ctrlKey && ['c','u','s','p'].includes(e.key)) ||
            (e.ctrlKey && e.shiftKey && ['I','i','J','j'].includes(e.key)) ||
            e.keyCode === 123
        ) { e.preventDefault(); alert('Ação protegida pelo sistema.'); }
    });

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const light = document.body.classList.contains('light-mode');
        document.getElementById('theme-icon').className = light ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        localStorage.setItem('theme', light ? 'light' : 'dark');
    }

    window.onload = () => {
        if (localStorage.getItem('theme') === 'light') toggleTheme();
    };
</script>
</body>
</html>

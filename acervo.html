<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/a/AVvXsEjvyHVCZolj28lEOEFo6M63izh7RcOq9tc7jph7e_Or-jSWVQ5TjRb0hcc-168k9rTwL9XnC9FdUti7imfIyv6QTbWgHDZB7zroM2I3nvUK58Zf6_sARve9qfBkasedBGsBkLahFohBhq2fbLB-hPSlFVrk5haPLt0Uy2jDnTszkHq0Qn3NfzkmK8vhNLI=w104-h117">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="auth-guard.js"></script>
    <meta charset="UTF-8">
    <title>Acervo Técnico | Refrigeração Eliezer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body { -webkit-user-select: none; user-select: none; }
        input, select, textarea { -webkit-user-select: text !important; user-select: text !important; }
        img { pointer-events: none !important; -webkit-user-drag: none !important; }

        :root {
            --bg: #0d1117;
            --text: #ffffff;
            --sub: rgba(255,255,255,0.38);
            --glass: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.08);
            --input-bg: rgba(255,255,255,0.05);
        }
        body.light-mode {
            --bg: #f0f2f5;
            --text: #1a1f26;
            --sub: rgba(0,0,0,0.45);
            --glass: rgba(255,255,255,0.82);
            --border: rgba(0,0,0,0.09);
            --input-bg: rgba(0,0,0,0.04);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 16px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient glow */
        .glow { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(90px); z-index: 0; }
        .glow-a { width: 500px; height: 500px; top: -180px; right: -140px; background: rgba(30,64,175,0.08); }
        .glow-b { width: 380px; height: 380px; bottom: -120px; left: -120px; background: rgba(16,185,129,0.05); }

        .page {
            width: 100%;
            max-width: 460px;
            height: 100%;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            animation: fadeUp 0.5s ease-out both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 16px;
        }
        .brand-title { font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.5px; line-height: 1; }
        .brand-title span { color: #1e40af; }
        .brand-sub { font-size: 9px; font-weight: 800; color: #1e40af; text-transform: uppercase; letter-spacing: 0.14em; margin-top: 4px; }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            width: 38px; height: 38px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14px;
            transition: background 0.2s;
            text-decoration: none;
        }
        .icon-btn:hover { background: rgba(30,64,175,0.12); }

        /* ── Content ── */
        .content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        /* ── Section label ── */
        .section-label {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--sub);
            margin-bottom: 10px;
            margin-left: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        /* ── Menu buttons (mesmo padrão do sistemas.html) ── */
        .menu { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }

        .menu-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 16px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 18px;
            text-decoration: none;
            color: var(--text);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .menu-btn:active { transform: scale(0.98); }

        .menu-btn.cyan   { border-color: rgba(30,64,175,0.2); }
        .menu-btn.cyan:hover   { background: rgba(30,64,175,0.08); border-color: rgba(30,64,175,0.4); }
        .menu-btn.indigo { border-color: rgba(71,85,105,0.2); }
        .menu-btn.indigo:hover { background: rgba(71,85,105,0.08); border-color: rgba(71,85,105,0.4); }
        .menu-btn.slate  { border-color: rgba(100,116,139,0.2); }
        .menu-btn.slate:hover  { background: rgba(100,116,139,0.08); border-color: rgba(100,116,139,0.4); }

        .btn-icon {
            width: 40px; height: 40px;
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            color: white;
        }
        .ic-cyan   { background: linear-gradient(135deg,#1e3a8a,#1e40af); }
        .ic-indigo { background: linear-gradient(135deg,#334155,#64748b); }
        .ic-slate  { background: linear-gradient(135deg,#334155,#64748b); }

        .btn-text strong { display: block; font-size: 15px; font-weight: 700; line-height: 1.2; }
        .btn-text span   { font-size: 11px; color: var(--sub); font-weight: 500; margin-top: 2px; display: block; }

        .btn-arrow {
            margin-left: auto;
            font-size: 11px;
            color: var(--sub);
            flex-shrink: 0;
            transition: transform 0.2s, color 0.2s;
        }
        .menu-btn:hover .btn-arrow { transform: translateX(3px); color: var(--text); }

        /* ── Nota de rodapé ── */
        .footer-note {
            margin-top: 16px;
            text-align: center;
            font-size: 10px;
            color: var(--sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* ── Fade-in escalonado ── */
        .menu-btn:nth-child(1) { animation: fadeUp 0.4s 0.05s ease-out both; }
        .menu-btn:nth-child(2) { animation: fadeUp 0.4s 0.10s ease-out both; }
        .menu-btn:nth-child(3) { animation: fadeUp 0.4s 0.15s ease-out both; }
        .menu-btn:nth-child(4) { animation: fadeUp 0.4s 0.20s ease-out both; }
    </style>
    <script src="config.js"></script>
</head>
<body>

<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<div class="page">

    <header class="header">
        <div>
            <div class="brand-title">Acervo <span>Técnico</span></div>
            <div class="brand-sub">Manuais técnicos</div>
        </div>
        <div class="header-actions">
            <a href="sistemas.html" class="icon-btn" title="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <button onclick="toggleTheme()" class="icon-btn" title="Tema">
                <i id="theme-icon" class="fa-solid fa-sun"></i>
            </button>
        </div>
    </header>

    <div class="content">

        <!-- ================================================================ -->
        <!-- Para adicionar um novo manual/guia no futuro, copie um bloco      -->
        <!-- <a class="menu-btn ..."> inteiro e cole aqui dentro do <div class="menu">, -->
        <!-- trocando href, ícone, título e descrição.                        -->
        <!-- Cores já disponíveis: cyan, indigo, slate (veja o CSS acima).     -->
        <!-- ================================================================ -->
        <p class="section-label"><i class="fa-solid fa-book" style="font-size:8px;"></i> Manuais</p>
        <div class="menu">
            <a href="manual.html" class="menu-btn indigo">
                <div class="btn-icon ic-indigo"><i class="fa-solid fa-book-open"></i></div>
                <div class="btn-text">
                    <strong>Controlador MT-512</strong>
                    <span>Guias e procedimentos passo a passo</span>
                </div>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </a>

            <a href="https://ajudaparatecnico.blogspot.com/" target="_blank" class="menu-btn cyan">
                <div class="btn-icon ic-cyan"><i class="fa-solid fa-book-bookmark"></i></div>
                <div class="btn-text">
                    <strong>Acervo Técnico</strong>
                    <span>Materiais de referência externos</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square btn-arrow"></i>
            </a>
        </div>

        <div class="footer-note">
            <i class="fa-solid fa-circle-info" style="font-size:9px;"></i>
            Mais manuais serão adicionados aqui futuramente
        </div>

    </div>

</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (
            (e.ctrlKey && ['c','u','s','p'].includes(e.key)) ||
            (e.ctrlKey && e.shiftKey && ['I','i','J','j'].includes(e.key)) ||
            e.keyCode === 123
        ) { e.preventDefault(); alert('Ação protegida pelo sistema.'); }
    });

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const light = document.body.classList.contains('light-mode');
        document.getElementById('theme-icon').className = light ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        localStorage.setItem('theme', light ? 'light' : 'dark');
    }

    window.onload = () => {
        if (localStorage.getItem('theme') === 'light') toggleTheme();
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha | Refrigeração Eliezer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/a/AVvXsEjvyHVCZolj28lEOEFo6M63izh7RcOq9tc7jph7e_Or-jSWVQ5TjRb0hcc-168k9rTwL9XnC9FdUti7imfIyv6QTbWgHDZB7zroM2I3nvUK58Zf6_sARve9qfBkasedBGsBkLahFohBhq2fbLB-hPSlFVrk5haPLt0Uy2jDnTszkHq0Qn3NfzkmK8vhNLI=w192-h192">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>

    <style>
        :root {
            --bg-body: #0d1117; --text-main: white;
            --glass-bg: rgba(255, 255, 255, 0.02); --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.04); --input-text: white;
            --subtitle-color: rgba(255, 255, 255, 0.45);
        }
        body.light-mode {
            --bg-body: #f0f2f5; --text-main: #1a1f26;
            --glass-bg: rgba(255, 255, 255, 0.8); --glass-border: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(0, 0, 0, 0.05); --input-text: #1a1f26;
            --subtitle-color: rgba(0, 0, 0, 0.6);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-body); padding: 20px; }
        .card { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-top: 4px solid #1e40af; border-radius: 40px; padding: 40px 30px; width: 100%; max-width: 410px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        h2 { color: var(--text-main); margin-bottom: 10px; font-size: 22px; }
        p.subtitle { color: var(--subtitle-color); font-size: 13px; margin-bottom: 25px; }
        input { width: 100%; background: var(--input-bg) !important; border: 1px solid var(--glass-border) !important; border-radius: 12px; padding: 14px; color: var(--input-text) !important; font-size: 14px; margin-bottom: 15px; outline: none; }
        .btn-main { width: 100%; padding: 16px; background: linear-gradient(135deg, #1e40af 0%, #27a9e3 100%); border: none; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; }
        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-msg { font-size: 12px; padding: 10px; border-radius: 10px; margin-bottom: 15px; display: none; }
        .error-msg { background: rgba(255,75,75,0.1); color: #ff4b4b; border: 1px solid rgba(255,75,75,0.2); }
        .ok-msg { background: rgba(39,169,227,0.1); color: #27a9e3; border: 1px solid rgba(39,169,227,0.2); }
        .link-auth { color: #27a9e3; cursor: pointer; font-size: 13px; display: block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <i class="fa-solid fa-key" style="font-size: 40px; color: #27a9e3; margin-bottom: 20px;"></i>
        <h2>Definir Nova Senha</h2>
        <p class="subtitle" id="subtitle">Escolha uma nova senha para sua conta</p>
        <div id="status" class="status-msg error-msg"></div>
        <div id="ok" class="status-msg ok-msg"></div>
        <input type="password" id="nova_senha" placeholder="Nova senha" autocomplete="new-password">
        <input type="password" id="confirma_senha" placeholder="Confirme a nova senha" autocomplete="new-password">
        <button class="btn-main" id="btn-salvar" onclick="salvarNovaSenha()">Salvar Nova Senha</button>
        <span class="link-auth" onclick="window.location.href='index.html'">Voltar ao Login</span>
    </div>

<script>
    let sessaoDeRecuperacaoValida = false;

    // O link do e-mail traz um token especial que o Supabase detecta
    // automaticamente (detectSessionInUrl: true, configurado em
    // supabase-client.js) e dispara o evento PASSWORD_RECOVERY abaixo.
    supabaseClient.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') {
            sessaoDeRecuperacaoValida = true;
        }
    });

    window.onload = async () => {
        // Dá um instante para o Supabase processar o token da URL antes de checar.
        setTimeout(async () => {
            const { data } = await supabaseClient.auth.getSession();
            if (!data.session) {
                document.getElementById('subtitle').textContent =
                    'Link inválido ou expirado. Solicite um novo link na tela de login.';
                document.getElementById('nova_senha').disabled = true;
                document.getElementById('confirma_senha').disabled = true;
                document.getElementById('btn-salvar').disabled = true;
            }
        }, 800);
    };

    async function salvarNovaSenha() {
        const senha = document.getElementById('nova_senha').value;
        const confirma = document.getElementById('confirma_senha').value;
        const status = document.getElementById('status');
        const ok = document.getElementById('ok');
        const btn = document.getElementById('btn-salvar');

        status.style.display = 'none';
        ok.style.display = 'none';

        if (!senha || senha.length < 6) {
            status.textContent = 'A senha deve ter pelo menos 6 caracteres.';
            status.style.display = 'block';
            return;
        }
        if (senha !== confirma) {
            status.textContent = 'As senhas não coincidem.';
            status.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Salvando...';

        const { error } = await supabaseClient.auth.updateUser({ password: senha });

        if (error) {
            status.textContent = 'Não foi possível salvar a nova senha. Tente pedir um novo link.';
            status.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Salvar Nova Senha';
            return;
        }

        ok.textContent = 'Senha atualizada com sucesso! Redirecionando para o login...';
        ok.style.display = 'block';
        await supabaseClient.auth.signOut();
        setTimeout(() => window.location.href = 'index.html', 2000);
    }
</script>
</body>
</html>
